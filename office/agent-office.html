<title>משרד הסוכנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Silkscreen:wght@400;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #0a0d14;
    --panel: #121824;
    --panel-hi: #1a2231;
    --line: #28324a;
    --ink: #ece6d6;
    --dim: #a2aabb;
    --muted: #6d7690;
    --plate: #f0b44c;
    --plate-deep: #a8761f;
    --working: #3ddc84;
    --needs_input: #ffcc33;
    --review: #5ab0ff;
    --done: #b7c0d0;
    --failed: #ff5a5f;
    --idle: #8d7bd6;
    --pixel: 'Silkscreen', 'Rubik', ui-monospace, monospace;
    --text: 'Rubik', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--void); color: var(--ink); }
  body { margin: 0; font-family: var(--text); padding-inline: 16px; padding-block: 14px 28px; }
  .wrap { max-width: 1480px; margin-inline: auto; display: grid; gap: 12px; }

  .hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
    background: var(--panel); border: 2px solid var(--line); box-shadow: 0 0 0 2px #05070b; padding: 10px 14px; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.005em; }
  .brand p { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; }
  .cnt { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 5px 10px; background: var(--panel-hi); border: 2px solid var(--line); }
  .cnt b { font-family: var(--pixel); font-size: 14px; }
  .sq { width: 9px; height: 9px; display: inline-block; flex: none; }
  .clock { text-align: end; }
  .clock .t { font-family: var(--pixel); font-size: 18px; }
  .clock .s { color: var(--muted); font-size: 12px; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 12px; align-items: start; }
  @media (max-width: 1080px) { .main { grid-template-columns: 1fr; } }

  /* the house */
  .scene { position: relative; overflow: hidden; container-type: inline-size; border: 2px solid var(--line); box-shadow: 0 0 0 2px #05070b; background: #000; }
  .scene canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; aspect-ratio: 512 / 320; cursor: pointer; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .roomsign { position: absolute; transform: translate(50%, 0); font-size: clamp(8px, 1.45cqw, 13px); font-weight: 700; color: #2a1d08;
    background: var(--plate); padding: 0.1em 0.5em; box-shadow: inset 0 -0.18em 0 var(--plate-deep), 0 0 0 1px #2a1d08; white-space: nowrap; }
  .tag { position: absolute; transform: translate(50%, -100%); pointer-events: auto; cursor: pointer; border: 0; font-family: var(--text);
    font-size: clamp(8px, 1.3cqw, 12px); font-weight: 500; color: var(--ink); background: rgba(8, 11, 18, 0.82); padding: 0.12em 0.45em;
    border-bottom: 2px solid currentColor; white-space: nowrap; line-height: 1.25; }
  .tag span { color: var(--ink); }
  .tag.sel { background: var(--plate); }
  .tag.sel span { color: #2a1d08; }
  .tag:focus-visible { outline: 2px solid var(--plate); outline-offset: 2px; }
  .ticker { display: flex; gap: 10px; align-items: center; padding: 7px 12px; background: var(--panel); border-top: 2px solid var(--line); font-size: 12.5px; color: var(--dim); overflow: hidden; }
  .ticker b { color: var(--plate); flex: none; }
  .ticker .run { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; padding: 10px 12px; background: var(--panel); border: 2px solid var(--line); font-size: 12.5px; color: var(--dim); }
  .legend div { display: flex; gap: 8px; align-items: center; }
  .legend strong { color: var(--ink); font-weight: 500; }

  .side { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); }
  @media (max-width: 1080px) { .side { position: static; } }
  .box { background: var(--panel); border: 2px solid var(--line); box-shadow: 0 0 0 2px #05070b; }
  .box h2 { margin: 0; font-size: 14px; font-weight: 700; padding: 8px 12px; background: #1b2334; border-bottom: 2px solid #0c1018;
    display: flex; justify-content: space-between; align-items: center; }
  .box h2 .pix { font-family: var(--pixel); color: var(--needs_input); font-size: 13px; }
  .list { max-height: 330px; overflow: auto; }
  .row { display: block; width: 100%; text-align: start; background: none; border: 0; border-bottom: 1px solid #1d2535; color: inherit; font-family: var(--text); padding: 9px 12px; cursor: pointer; }
  .row:hover, .row.sel { background: var(--panel-hi); }
  .row:focus-visible { outline: 2px solid var(--plate); outline-offset: -2px; }
  .row .t { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; }
  .row .a { font-size: 12.5px; color: var(--needs_input); margin-top: 3px; line-height: 1.45; }
  .row .m { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .detail { padding: 12px; display: grid; gap: 10px; font-size: 13px; line-height: 1.5; }
  .detail h3 { margin: 0; font-size: 18px; font-weight: 800; }
  .detail .repo { font-family: var(--pixel); font-size: 11px; color: var(--muted); direction: ltr; text-align: end; }
  .where { font-size: 12.5px; color: var(--dim); }
  .sess { border: 1px solid var(--line); background: #0f141f; padding: 8px 10px; display: grid; gap: 4px; }
  .sess .h { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 500; }
  .pill { font-size: 11px; padding: 1px 7px; color: #0a0d14; font-weight: 700; white-space: nowrap; }
  .sess .d { color: var(--dim); font-size: 12.5px; }
  .sess .need { color: var(--needs_input); font-size: 12.5px; }
  .sess .f { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .sess a { color: #2a1d08; background: var(--plate); text-decoration: none; padding: 2px 8px; font-weight: 500; box-shadow: inset 0 -2px 0 var(--plate-deep); }
  .sess a.sec { background: var(--panel-hi); color: var(--ink); box-shadow: inset 0 -2px 0 var(--line); }
  .hint { color: var(--muted); font-size: 12.5px; padding: 14px 12px; }
  .state { color: var(--dim); padding: 30px; text-align: center; }
  .num { font-family: var(--pixel); direction: ltr; unicode-bidi: isolate; }
</style>

<div class="wrap">
  <header class="hud">
    <div class="brand">
      <h1>משרד הסוכנים</h1>
      <p>כל פרויקט הוא דייר בבית — רואים מי עובד, מי מחכה לך ומי נח</p>
    </div>
    <div class="counts" id="counts"></div>
    <div class="clock"><div class="t num" id="clock">--:--</div><div class="s" id="stamp">שעון ישראל</div></div>
  </header>

  <div class="main">
    <div>
      <div class="scene" id="scene">
        <canvas id="cv" width="512" height="320" aria-label="הבית של הפרויקטים — לחץ על דייר כדי לראות את הפרויקט"></canvas>
        <div class="overlay" id="overlay"></div>
        <div class="ticker"><b>ביומן הבית:</b><span class="run" id="ticker">טוען…</span></div>
      </div>
      <div class="legend" id="legend" style="margin-top:12px"></div>
    </div>
    <aside class="side">
      <div class="box">
        <h2>צריכים אותך <span class="pix" id="qcount">0</span></h2>
        <div class="list" id="queue"></div>
      </div>
      <div class="box">
        <h2>הפרויקט שנבחר</h2>
        <div id="detail"><div class="hint">לחץ על דייר בבית, או על פרויקט ברשימה, כדי לראות את כל הסוכנים שלו ומה כל אחד צריך.</div></div>
      </div>
      <div class="box">
        <h2>כל הדיירים <span class="pix" id="pcount" style="color:var(--dim)">0</span></h2>
        <div class="list" id="plist"></div>
      </div>
    </aside>
  </div>
</div>

<script>
(() => {
  // ------------------------------------------------------------------ model
  const ST = {
    working: { he: 'עובד עכשיו', color: '#3ddc84', room: 'work' },
    needs_input: { he: 'מחכה לך', color: '#ffcc33', room: 'entry' },
    failed: { he: 'נתקע', color: '#ff5a5f', room: 'repair' },
    review: { he: 'מוכן לבדיקה', color: '#5ab0ff', room: 'meet' },
    done: { he: 'הושלם', color: '#b7c0d0', room: 'living' },
    idle: { he: 'במנוחה', color: '#8d7bd6', room: 'attic' },
  };
  const PRIORITY = ['working', 'needs_input', 'failed', 'review', 'done'];
  const ROOMS = {
    work: { he: 'חדר העבודה', floor: 'up', x0: 30, x1: 312, desc: 'סוכנים שעובדים עכשיו — יושבים מול המחשב ומקלידים' },
    meet: { he: 'חדר הישיבות', floor: 'up', x0: 328, x1: 482, desc: 'עבודה שמוכנה לבדיקה שלך — מוצגת על הלוח' },
    entry: { he: 'הכניסה', floor: 'down', x0: 30, x1: 136, desc: 'מחכים לך — עומדים ליד הדלת עם שאלה' },
    living: { he: 'הסלון והמטבח', floor: 'down', x0: 182, x1: 376, desc: 'הושלמו — נחים על הספה ושותים קפה' },
    repair: { he: 'חדר התיקונים', floor: 'down', x0: 392, x1: 482, desc: 'נתקעו — המחשב עשה עשן, צריך טיפול' },
    attic: { he: 'עליית הגג', floor: 'attic', x0: 184, x1: 328, desc: 'פרויקטים בלי סוכן פעיל — ישנים' },
  };
  const FLOOR_Y = { attic: 68, up: 178, down: 294 };
  const STAIR = { downX: 144, upX: 176 };   // staircase: bottom at downX on ground floor, top at upX on upper floor
  const LADDER_X = 196;                    // ladder between upper floor and attic
  const W = 512, H = 320;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let projects = [];      // [{id,name,repo,order,note,sessions:[],status}]
  let agents = [], roomsDocs = [], meta = null;
  let selected = null;
  const people = new Map(); // projectId -> person

  const $ = (id) => document.getElementById(id);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; };
  const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  function ago(iso) {
    const ms = Date.now() - new Date(iso).getTime(); if (!isFinite(ms)) return '';
    const m = Math.round(ms / 60000); if (m < 60) return m <= 1 ? 'עכשיו' : `לפני ${m} דק׳`;
    const h = Math.round(m / 60); if (h < 24) return h === 1 ? 'לפני שעה' : `לפני ${h} שעות`;
    const d = Math.round(h / 24); return d === 1 ? 'אתמול' : `לפני ${d} ימים`;
  }

  const loaded = { rooms: false, agents: false };
  function rebuild() {
    if (!loaded.rooms || !loaded.agents) return; // place residents only once both collections have arrived
    projects = roomsDocs.map((r) => {
      const sessions = agents.filter((a) => a.project === r.id && ST[a.status])
        .sort((x, y) => PRIORITY.indexOf(x.status) - PRIORITY.indexOf(y.status) || String(y.updatedAt).localeCompare(String(x.updatedAt)));
      const status = sessions.length ? sessions[0].status : 'idle';
      const last = sessions.reduce((m, s) => (String(s.updatedAt) > m ? String(s.updatedAt) : m), '');
      return { ...r, sessions, status, last };
    }).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
    placePeople();
    renderPanels();
  }

  // ------------------------------------------------------------------ people & movement
  const SKIN = ['#f3c9a2', '#dca577', '#b07448', '#7d4b2c', '#f7dcc2'];
  const HAIR = ['#2b1d12', '#6b3b1d', '#e0ad4a', '#161616', '#b8472c', '#ece6d6', '#3b5bd6'];
  const SHIRT = ['#3a7bd5', '#e05d44', '#48a868', '#f0b44c', '#8e5bd0', '#2fb3b3', '#d64f8c', '#e4e4e4', '#ff8a3d', '#5ac8fa'];

  function spotsFor(room, n) {
    const r = ROOMS[room];
    if (room === 'work') return [52, 92, 132, 236, 276, 300, 72, 112].slice(0, Math.max(n, 1));
    if (room === 'meet') return [352, 376, 424, 448, 466, 400];
    if (room === 'entry') return [50, 70, 90, 110, 126];
    if (room === 'attic') return [206, 240, 274, 308, 222, 290];
    const out = []; for (let i = 0; i < 8; i++) out.push(r.x0 + 14 + ((r.x1 - r.x0 - 28) * (i + 0.5)) / 8); return out;
  }

  function route(from, to) {
    // from/to: {x, floor}; returns waypoints [{x,y,climb?}]
    const pts = [];
    let f = from.floor, x = from.x;
    const go = (nx, fl) => pts.push({ x: nx, y: FLOOR_Y[fl], floor: fl });
    const order = ['down', 'up', 'attic'];
    while (f !== to.floor) {
      const up = order.indexOf(to.floor) > order.indexOf(f);
      if (f === 'down' && up) { go(STAIR.downX, 'down'); go(STAIR.upX, 'up'); f = 'up'; }
      else if (f === 'up' && !up) { go(STAIR.upX, 'up'); go(STAIR.downX, 'down'); f = 'down'; }
      else if (f === 'up' && up) { go(LADDER_X, 'up'); pts.push({ x: LADDER_X, y: FLOOR_Y.attic, floor: 'attic', climb: true }); f = 'attic'; }
      else { go(LADDER_X, 'attic'); pts.push({ x: LADDER_X, y: FLOOR_Y.up, floor: 'up', climb: true }); f = 'up'; }
      x = pts[pts.length - 1].x;
    }
    void x;
    go(to.x, to.floor);
    return pts;
  }

  function placePeople() {
    const byRoom = {};
    for (const p of projects) (byRoom[ST[p.status].room] ??= []).push(p);
    for (const [room, list] of Object.entries(byRoom)) {
      const spots = spotsFor(room, list.length);
      list.forEach((p, i) => {
        const r = ROOMS[room];
        const home = { x: spots[i % spots.length] + (i >= spots.length ? 6 : 0), floor: r.floor, room };
        let person = people.get(p.id);
        const h = hash(p.id);
        if (!person) {
          person = {
            id: p.id, x: home.x, y: FLOOR_Y[r.floor], floor: r.floor, path: [], home, room, face: h % 2 ? 1 : -1,
            skin: SKIN[h % SKIN.length], hair: HAIR[(h >> 3) % HAIR.length], shirt: SHIRT[(h >> 6) % SHIRT.length],
            pants: ['#2c3550', '#3d2c22', '#1f2a2a', '#4a4f5c'][(h >> 9) % 4], phase: (h % 100) / 10, wait: 0, action: 'idle', status: p.status,
          };
          people.set(p.id, person);
        } else if (person.room !== room || person.home.x !== home.x) {
          person.path = reduced ? [] : route({ x: person.x, floor: person.floor }, home);
          if (reduced) { person.x = home.x; person.y = FLOOR_Y[r.floor]; person.floor = r.floor; }
        }
        person.home = home; person.room = room; person.status = p.status; person.project = p;
      });
    }
    for (const id of [...people.keys()]) if (!projects.some((p) => p.id === id)) people.delete(id);
    buildTags();
  }

  const SPEED = 26; // px per second
  function update(dt) {
    for (const p of people.values()) {
      if (p.path.length) {
        const tgt = p.path[0];
        const dx = tgt.x - p.x, dy = tgt.y - p.y;
        const dist = Math.hypot(dx, dy);
        const step = SPEED * dt * (tgt.climb ? 0.6 : 1);
        if (dist <= step) { p.x = tgt.x; p.y = tgt.y; p.floor = tgt.floor; p.path.shift(); }
        else { p.x += (dx / dist) * step; p.y += (dy / dist) * step; if (Math.abs(dx) > 0.1) p.face = dx > 0 ? 1 : -1; }
        p.action = tgt.climb ? 'climb' : 'walk';
        continue;
      }
      // idle behaviour per room
      p.wait -= dt;
      if (p.room === 'living' || p.room === 'repair' || p.room === 'entry') {
        if (p.wait <= 0) {
          const r = ROOMS[p.room];
          const span = p.room === 'entry' ? 22 : p.room === 'repair' ? 26 : 70;
          const nx = Math.max(r.x0 + 6, Math.min(r.x1 - 6, p.home.x + (Math.random() * 2 - 1) * span));
          if (!reduced && Math.random() < 0.6) p.path = [{ x: nx, y: FLOOR_Y[p.floor], floor: p.floor }];
          p.wait = 2.5 + Math.random() * 5;
        }
        p.action = p.room === 'living' ? 'coffee' : p.room === 'repair' ? 'panic' : 'wave';
      } else if (p.room === 'work') { p.action = 'type'; p.face = 1; }
      else if (p.room === 'meet') { p.action = 'present'; p.face = p.x < 400 ? 1 : -1; }
      else if (p.room === 'attic') { p.action = 'sleep'; }
    }
  }

  // ------------------------------------------------------------------ drawing
  const cv = $('cv'); const ctx = cv.getContext('2d');
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H; const b = bg.getContext('2d');
  const R = (c, x, y, w, h) => { c.fillStyle = h === undefined ? x : c.fillStyle; };
  void R;
  function px(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); }

  function israelHour() {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
    const hh = +parts.find((p) => p.type === 'hour').value, mm = +parts.find((p) => p.type === 'minute').value;
    return { hh, mm, f: hh + mm / 60 };
  }
  function skyColors(f) {
    if (f >= 7 && f < 17) return ['#6fb7ff', '#bfe3ff', false];
    if (f >= 17 && f < 19.5) return ['#3b3f86', '#f39a5b', false];
    if (f >= 5 && f < 7) return ['#4b5fa8', '#f6c28b', false];
    return ['#070b1f', '#1b2447', true];
  }

  let bgHour = -1;
  function drawHouse() {
    const { f, hh } = israelHour();
    bgHour = hh;
    const [top, bot, night] = skyColors(f);
    const g = b.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    if (night) { for (let i = 0; i < 60; i++) { const h = hash('s' + i); px(b, h % W, (h >> 9) % 120, 1, 1, i % 7 ? '#cfd8ff' : '#ffffff'); } px(b, 452, 18, 10, 10, '#f5efcf'); px(b, 456, 18, 6, 6, top); }
    else { px(b, 44, 22, 14, 14, '#ffe27a'); px(b, 42, 26, 18, 6, '#ffe27a'); px(b, 48, 20, 6, 18, '#ffe27a'); }
    // ground
    px(b, 0, 298, W, 22, night ? '#1d3a22' : '#3f8f3e'); px(b, 0, 298, W, 3, night ? '#27502e' : '#58b04f');
    for (let i = 0; i < 40; i++) { const h = hash('g' + i); px(b, h % W, 302 + ((h >> 8) % 14), 2, 1, night ? '#2c5a33' : '#4fa546'); }
    // trees
    const tree = (x) => { px(b, x + 6, 262, 4, 36, '#5b3a22'); px(b, x, 236, 16, 30, night ? '#1f4a28' : '#2f7a3a'); px(b, x + 2, 230, 12, 8, night ? '#255630' : '#3a9147'); };
    tree(2); tree(494 - 4);
    // roof
    b.fillStyle = night ? '#4a2323' : '#8e3b2e';
    b.beginPath(); b.moveTo(10, 74); b.lineTo(256, 6); b.lineTo(502, 74); b.closePath(); b.fill();
    for (let y = 14; y < 74; y += 6) { const half = ((y - 6) / 68) * 246; px(b, 256 - half, y, half * 2, 1, night ? '#3a1b1b' : '#6f2b21'); }
    px(b, 382, 22, 14, 30, '#6c6c74'); px(b, 380, 20, 18, 4, '#55555c');
    // walls
    const wall = night ? '#3b3226' : '#d9c7a4';
    px(b, 20, 72, 472, 226, '#2a2118');
    // attic interior
    b.fillStyle = night ? '#2d241a' : '#b89a6a'; b.beginPath(); b.moveTo(150, 70); b.lineTo(256, 24); b.lineTo(362, 70); b.closePath(); b.fill();
    px(b, 168, 68, 176, 4, '#5a4128');
    // attic window (round)
    px(b, 250, 38, 12, 12, night ? '#ffd76a' : '#9ad0ff'); px(b, 255, 38, 2, 12, '#5a4128'); px(b, 250, 43, 12, 2, '#5a4128');
    // rooms
    const room = (x0, y0, x1, y1, col) => px(b, x0, y0, x1 - x0, y1 - y0, col);
    room(24, 76, 318, 178, night ? '#39465e' : '#cfe0f0');   // work
    room(322, 76, 488, 178, night ? '#453a57' : '#e6d9f2');  // meeting
    room(24, 184, 140, 294, night ? '#4a3d2b' : '#f0dfbf');  // entry
    room(140, 184, 178, 294, night ? '#3a3226' : '#d8c6a0'); // stairwell
    room(178, 184, 380, 294, night ? '#4b3a2e' : '#f4d7b8'); // living
    room(384, 184, 488, 294, night ? '#3a3f45' : '#cfd6dc'); // repair
    // floors
    const floor = (x0, y, x1, col) => { px(b, x0, y, x1 - x0, 4, col); for (let x = x0; x < x1; x += 12) px(b, x, y, 1, 4, '#00000033'); };
    floor(24, 178, 488, '#8a5a36'); floor(24, 294, 488, '#7a4e2f');
    px(b, 318, 76, 4, 102, '#2a2118'); px(b, 380, 184, 4, 110, '#2a2118'); px(b, 20, 180, 472, 4, '#2a2118');
    // windows
    const win = (x, y, w, h) => { px(b, x - 1, y - 1, w + 2, h + 2, '#5a4128'); px(b, x, y, w, h, night ? '#ffd76a' : '#9ad0ff'); px(b, x + w / 2 - 0.5, y, 1, h, '#5a4128'); px(b, x, y + h / 2 - 0.5, w, 1, '#5a4128'); };
    win(160, 92, 22, 18); win(440, 92, 26, 18); win(300, 200, 22, 18); win(96, 202, 20, 16);
    // stairs
    for (let i = 0; i < 10; i++) px(b, 142 + i * 3.6, 290 - i * 11.4, 8, 4, '#6b4a2c');
    px(b, 140, 180, 4, 116, '#2a2118');
    // ladder to attic
    px(b, LADDER_X - 5, 72, 2, 106, '#7a5534'); px(b, LADDER_X + 3, 72, 2, 106, '#7a5534'); for (let y = 76; y < 176; y += 8) px(b, LADDER_X - 5, y, 10, 2, '#7a5534');

    // --- work room: desks with monitors
    for (const x of [52, 92, 132, 236, 276]) {
      px(b, x - 2, 152, 26, 3, '#b9895a'); px(b, x, 155, 2, 22, '#7d5836'); px(b, x + 20, 155, 2, 22, '#7d5836');
      px(b, x + 6, 138, 14, 11, '#1b2230'); px(b, x + 12, 149, 2, 3, '#1b2230'); px(b, x + 5, 150, 16, 2, '#4a5263');
      px(b, x - 8, 160, 8, 3, '#34507a'); px(b, x - 6, 163, 2, 14, '#2a3b58');
    }
    px(b, 214, 96, 20, 30, night ? '#2a3244' : '#8fa2b8'); px(b, 216, 98, 16, 12, night ? '#141a26' : '#dbe7f2'); // server rack-ish shelf
    px(b, 30, 90, 36, 22, '#e6e1d0'); px(b, 32, 92, 32, 3, '#3ddc84'); px(b, 32, 97, 22, 2, '#5ab0ff'); px(b, 32, 101, 26, 2, '#f0b44c'); // kanban on wall
    // --- meeting room: whiteboard + table
    px(b, 368, 96, 70, 36, '#f4f4f0'); px(b, 366, 94, 74, 2, '#8a8f98'); px(b, 366, 132, 74, 3, '#8a8f98');
    px(b, 374, 104, 20, 2, '#5ab0ff'); px(b, 374, 110, 34, 2, '#5ab0ff'); px(b, 374, 116, 26, 2, '#e05d44'); px(b, 412, 102, 18, 18, '#cfe8ff'); px(b, 414, 116, 4, 3, '#3ddc84'); px(b, 420, 111, 4, 8, '#3ddc84'); px(b, 426, 106, 4, 13, '#3ddc84');
    px(b, 362, 162, 84, 4, '#6d4a2d'); px(b, 368, 166, 3, 12, '#4f3620'); px(b, 438, 166, 3, 12, '#4f3620');
    // --- entry: door, bench, bell, mailbox
    px(b, 26, 236, 22, 58, '#6d4125'); px(b, 28, 238, 18, 54, '#8a5530'); px(b, 42, 264, 3, 3, '#f0b44c');
    px(b, 58, 280, 58, 4, '#8a5530'); px(b, 60, 284, 3, 10, '#5a3a22'); px(b, 110, 284, 3, 10, '#5a3a22');
    px(b, 120, 226, 10, 8, '#f0b44c'); px(b, 124, 222, 2, 4, '#a8761f'); // bell
    px(b, 62, 212, 26, 16, '#fff4cc'); px(b, 64, 214, 22, 2, '#ffcc33'); // notice board
    // --- living: couch, TV, rug, plant, kitchen counter, coffee machine, fridge
    px(b, 186, 290, 110, 4, night ? '#6a2f3c' : '#b5485d');
    px(b, 196, 268, 60, 14, '#4063a8'); px(b, 192, 262, 8, 20, '#34528c'); px(b, 252, 262, 8, 20, '#34528c'); px(b, 196, 262, 60, 8, '#4a70bb');
    px(b, 206, 226, 40, 24, '#15181f'); px(b, 208, 228, 36, 20, '#243a5a'); px(b, 224, 250, 4, 6, '#15181f');
    px(b, 184, 262, 8, 32, '#2f7a3a'); px(b, 182, 256, 12, 10, '#3a9147'); px(b, 186, 286, 6, 8, '#8a5530');
    px(b, 300, 262, 66, 32, '#c7cbd1'); px(b, 300, 258, 66, 5, '#8a8f98'); px(b, 306, 270, 10, 18, '#b0b5bc'); px(b, 324, 270, 10, 18, '#b0b5bc');
    px(b, 344, 244, 12, 15, '#2e2e33'); px(b, 346, 248, 8, 4, '#e05d44'); // coffee machine
    px(b, 368, 222, 10, 72, '#e9edf2'); px(b, 368, 248, 10, 1, '#8a8f98');
    // --- repair room: workbench, broken PC, toolbox, fire extinguisher
    px(b, 394, 268, 64, 4, '#6d4a2d'); px(b, 398, 272, 3, 22, '#4f3620'); px(b, 452, 272, 3, 22, '#4f3620');
    px(b, 432, 250, 18, 16, '#1b2230'); px(b, 434, 252, 14, 11, '#3a1216'); px(b, 437, 254, 2, 2, '#ff5a5f'); px(b, 443, 258, 2, 2, '#ff5a5f');
    px(b, 404, 260, 16, 8, '#c0392b'); px(b, 408, 257, 8, 3, '#8e2a20');
    px(b, 476, 272, 6, 16, '#e0312b'); px(b, 477, 268, 4, 4, '#2a2a2a');
    // --- attic: beds + boxes
    for (const x of [206, 240, 274, 308]) { px(b, x - 14, 60, 26, 6, '#7a5534'); px(b, x - 12, 56, 22, 5, '#e9e4d6'); px(b, x - 12, 56, 6, 5, '#ffffff'); }
    px(b, 330, 58, 12, 10, '#a67b4b'); px(b, 170, 60, 10, 8, '#a67b4b');
    // chimney smoke puff handled per frame; outline
    px(b, 20, 294, 472, 4, '#2a2118');
  }

  function drawPerson(p, t) {
    const x = Math.round(p.x), y = Math.round(p.y);
    const f = p.face;
    const P = (dx, dy, w, h, c) => px(ctx, f > 0 ? x + dx : x - dx - w, y + dy, w, h, c);
    const walk = p.action === 'walk' ? Math.floor(t * 8 + p.phase) % 2 : 0;
    if (p.action === 'sleep') {
      // lying in bed
      px(ctx, x - 10, y - 12, 6, 5, p.skin); px(ctx, x - 10, y - 13, 6, 2, p.hair);
      px(ctx, x - 4, y - 12, 14, 5, p.shirt);
      if (!reduced) { const z = Math.floor(t * 1.2 + p.phase) % 3; px(ctx, x - 6 + z * 3, y - 20 - z * 3, 3, 1, '#ffffff'); px(ctx, x - 5 + z * 3, y - 19 - z * 3, 1, 1, '#ffffff'); px(ctx, x - 6 + z * 3, y - 18 - z * 3, 3, 1, '#ffffff'); }
      return;
    }
    const sitting = p.action === 'type';
    const bob = p.action === 'type' && !reduced ? Math.floor(t * 6 + p.phase) % 2 : 0;
    // shadow
    px(ctx, x - 4, y - 1, 9, 1, 'rgba(0,0,0,0.25)');
    if (sitting) {
      P(-3, -9, 7, 2, p.pants); P(2, -9, 2, 8, p.pants); P(-3, -9, 2, 8, p.pants);
    } else if (p.action === 'climb') {
      const c = Math.floor(t * 6 + p.phase) % 2; P(-3, -8 + c, 2, 8, p.pants); P(1, -8 - c + 1, 2, 7, p.pants);
    } else {
      P(-3, -7, 2, 7 - walk, p.pants); P(1, -7, 2, 6 + walk, p.pants);
      P(-3, -1 + (walk ? -1 : 0), 3, 1, '#1b1b1b'); P(1, -1, 3, 1, '#1b1b1b');
    }
    const top = sitting ? -18 : -16;
    // body
    P(-4, top + 6 + bob, 8, 8, p.shirt);
    // head
    P(-3, top + bob, 6, 6, p.skin); P(-3, top - 1 + bob, 6, 2, p.hair); P(-3, top + 1 + bob, 1, 3, p.hair);
    P(1, top + 2 + bob, 1, 1, '#1b1b1b');
    // arms by action
    if (p.action === 'type') { const a = reduced ? 0 : Math.floor(t * 10 + p.phase) % 2; P(3, top + 8 + a, 5, 2, p.shirt); P(8, top + 8 + a, 1, 2, p.skin); }
    else if (p.action === 'present') { const a = reduced ? 0 : Math.floor(t * 1.5 + p.phase) % 2; P(3, top + 5 - a * 2, 2, 6, p.shirt); P(4, top + 3 - a * 2, 1, 2, p.skin); }
    else if (p.action === 'coffee') { P(3, top + 9, 3, 2, p.shirt); P(5, top + 7, 3, 4, '#f4f4f4'); if (!reduced && Math.floor(t * 2 + p.phase) % 3 === 0) P(6, top + 3, 1, 3, 'rgba(255,255,255,0.7)'); }
    else if (p.action === 'wave') { const a = reduced ? 0 : Math.floor(t * 3 + p.phase) % 2; P(3, top + 3 + a, 2, 6, p.shirt); P(3, top + 1 + a, 2, 2, p.skin); }
    else if (p.action === 'panic') { P(3, top + 7, 2, 5, p.shirt); if (!reduced) { const s = (t * 2 + p.phase) % 1; px(ctx, x + (f > 0 ? -2 : 1), y + top - 3 - s * 4, 2, 2, 'rgba(120,200,255,0.8)'); } }
    else { P(3, top + 7, 2, 6, p.shirt); }
    // status bubble
    const col = ST[p.status].color;
    if (p.status === 'needs_input' && (reduced || Math.floor(t * 2 + p.phase) % 4 !== 3)) {
      px(ctx, x - 4, y + top - 13, 9, 9, '#fff4cc'); px(ctx, x - 4, y + top - 13, 9, 1, col); px(ctx, x - 1, y + top - 4, 3, 2, '#fff4cc');
      px(ctx, x, y + top - 11, 1, 4, '#8a6400'); px(ctx, x, y + top - 6, 1, 1, '#8a6400');
    } else if (p.status === 'failed') {
      px(ctx, x - 1, y + top - 6, 3, 3, col);
    }
    if (selected === p.id) { px(ctx, x - 1, y + top - (p.status === 'needs_input' ? 20 : 10), 3, 3, '#f0b44c'); px(ctx, x, y + top - (p.status === 'needs_input' ? 17 : 7), 1, 2, '#f0b44c'); }
  }

  function drawDynamic(t) {
    const night = skyColors(israelHour().f)[2];
    // monitors in work room: lit when someone is typing there
    const typing = [...people.values()].filter((p) => p.room === 'work' && !p.path.length);
    for (const x of [52, 92, 132, 236, 276]) {
      const busy = typing.some((p) => Math.abs(p.x - (x - 4)) < 14 || Math.abs(p.x - x) < 14);
      px(ctx, x + 7, 139, 12, 9, busy ? '#0f2c22' : '#0e1320');
      if (busy) for (let r = 0; r < 3; r++) { const w = 3 + ((Math.floor(t * 4) + r * 3 + x) % 8); px(ctx, x + 8, 140 + r * 3, w, 1, '#3ddc84'); }
    }
    // TV flicker
    const tv = ['#243a5a', '#2d4d7a', '#3a5f8a', '#1f3350'][Math.floor(t * 3) % 4];
    px(ctx, 208, 228, 36, 20, reduced ? '#243a5a' : tv);
    // coffee steam
    if (!reduced) { const s = (t * 1.5) % 1; px(ctx, 348, 240 - s * 8, 2, 2, `rgba(255,255,255,${0.7 - s * 0.6})`); }
    // repair smoke if someone is stuck
    if ([...people.values()].some((p) => p.status === 'failed')) {
      for (let i = 0; i < 3; i++) { const s = reduced ? 0.4 : (t * 0.6 + i / 3) % 1; px(ctx, 438 + i * 3 + s * 6, 246 - s * 26, 4, 4, `rgba(150,150,160,${0.7 - s * 0.7})`); }
    }
    // chimney smoke
    for (let i = 0; i < 3; i++) { const s = reduced ? 0.3 : (t * 0.25 + i / 3) % 1; px(ctx, 386 + s * 14, 16 - s * 18, 5, 4, `rgba(220,220,230,${0.55 - s * 0.55})`); }
    // bell rings when someone is waiting
    if ([...people.values()].some((p) => p.status === 'needs_input') && !reduced && Math.floor(t * 4) % 6 === 0) { px(ctx, 117, 224, 2, 2, '#ffcc33'); px(ctx, 133, 224, 2, 2, '#ffcc33'); }
    if (night) { ctx.fillStyle = 'rgba(255, 214, 120, 0.05)'; ctx.fillRect(24, 76, 464, 218); }
  }

  let last = performance.now(), clockT = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now; clockT += dt;
    if (israelHour().hh !== bgHour) drawHouse();
    update(dt);
    ctx.drawImage(bg, 0, 0);
    drawDynamic(clockT);
    const list = [...people.values()].sort((a, b) => a.y - b.y);
    for (const p of list) drawPerson(p, clockT);
    positionTags();
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ overlay (room signs + name tags)
  const overlay = $('overlay');
  function roomSigns() {
    const signs = [['work', 170, 78], ['meet', 405, 78], ['entry', 82, 186], ['living', 279, 186], ['repair', 436, 186], ['attic', 256, 26]];
    for (const [k, x, y] of signs) { const s = el('div', 'roomsign', ROOMS[k].he); s.style.right = `${100 - (x / W) * 100}%`; s.style.top = `${(y / H) * 100}%`; overlay.append(s); }
  }
  const tags = new Map();
  function buildTags() {
    for (const [id, tg] of tags) if (!people.has(id)) { tg.remove(); tags.delete(id); }
    for (const p of people.values()) {
      let tg = tags.get(p.id);
      if (!tg) {
        tg = el('button', 'tag'); tg.type = 'button';
        tg.addEventListener('click', () => select(p.id));
        overlay.append(tg); tags.set(p.id, tg);
      }
      const proj = p.project;
      tg.textContent = ''; tg.append(el('span', '', String(proj.name).split(' — ')[0]));
      tg.style.color = ST[p.status].color;
      tg.setAttribute('aria-label', `${proj.name} — ${ST[p.status].he}`);
      tg.classList.toggle('sel', selected === p.id);
    }
  }
  function positionTags() {
    // stagger tags vertically so neighbours in the same room never overlap
    const levels = new Map();
    const byFloor = {};
    for (const p of people.values()) (byFloor[p.floor + Math.round(p.y / 40)] ??= []).push(p);
    for (const list of Object.values(byFloor)) {
      list.sort((a, b) => a.x - b.x);
      const lastX = [];
      for (const p of list) {
        const tg = tags.get(p.id);
        const wLog = tg ? (tg.offsetWidth / Math.max(1, cv.clientWidth)) * W + 4 : 40;
        let lv = 0;
        while (lastX[lv] !== undefined && p.x - wLog < lastX[lv]) lv++;
        lastX[lv] = p.x;
        levels.set(p.id, lv);
      }
    }
    for (const p of people.values()) {
      const tg = tags.get(p.id); if (!tg) continue;
      const head = (p.action === 'sleep' ? 16 : p.status === 'needs_input' ? 32 : 22) + (levels.get(p.id) || 0) * 10;
      tg.style.right = `${100 - (p.x / W) * 100}%`;
      tg.style.top = `${Math.max(0, ((p.y - head) / H) * 100)}%`;
      tg.style.zIndex = String(10 - (levels.get(p.id) || 0));
    }
  }
  cv.addEventListener('click', (e) => {
    const r = cv.getBoundingClientRect(); const mx = ((e.clientX - r.left) / r.width) * W, my = ((e.clientY - r.top) / r.height) * H;
    let best = null, bd = 14;
    for (const p of people.values()) { const d = Math.hypot(p.x - mx, p.y - 9 - my); if (d < bd) { bd = d; best = p; } }
    if (best) select(best.id);
  });

  // ------------------------------------------------------------------ panels
  function select(id) { selected = id; buildTags(); renderPanels(); }

  function pill(status) { const s = el('span', 'pill', ST[status].he); s.style.background = ST[status].color; return s; }

  function renderPanels() {
    // counts (by agent/session)
    const counts = { working: 0, needs_input: 0, review: 0, done: 0, failed: 0 };
    for (const a of agents) if (counts[a.status] !== undefined) counts[a.status]++;
    const c = $('counts'); c.textContent = '';
    for (const k of ['working', 'needs_input', 'review', 'done', 'failed']) {
      const d = el('span', 'cnt'); const sq = el('span', 'sq'); sq.style.background = ST[k].color;
      d.append(sq, el('span', '', ST[k].he), el('b', '', String(counts[k]))); c.append(d);
    }
    const tot = el('span', 'cnt'); tot.append(el('span', '', 'דיירים'), el('b', '', String(projects.length))); c.prepend(tot);

    // needs-you queue (sessions)
    const q = $('queue'); q.textContent = '';
    const needs = agents.filter((a) => a.status === 'needs_input' || a.status === 'failed').sort((x, y) => String(y.updatedAt).localeCompare(String(x.updatedAt)));
    $('qcount').textContent = String(needs.length);
    if (!needs.length) q.append(el('div', 'hint', 'אף אחד לא מחכה לך כרגע.'));
    for (const a of needs) {
      const proj = projects.find((p) => p.id === a.project);
      const r = el('button', 'row'); r.type = 'button';
      const t = el('div', 't'); const sq = el('span', 'sq'); sq.style.background = ST[a.status].color; t.append(sq, el('span', '', `${proj ? proj.name : a.project} · ${a.name}`));
      r.append(t, el('div', 'a', a.needsAction || a.detail || ''), el('div', 'm', `${ST[a.status].he} · ${ago(a.updatedAt)}`));
      r.addEventListener('click', () => select(a.project));
      q.append(r);
    }

    // all residents
    const pl = $('plist'); pl.textContent = ''; $('pcount').textContent = String(projects.length);
    for (const p of projects) {
      const r = el('button', 'row' + (selected === p.id ? ' sel' : '')); r.type = 'button';
      const t = el('div', 't'); const sq = el('span', 'sq'); sq.style.background = ST[p.status].color; t.append(sq, el('span', '', p.name));
      r.append(t, el('div', 'm', `${ROOMS[ST[p.status].room].he} · ${p.sessions.length} סוכנים${p.last ? ' · ' + ago(p.last) : ''}`));
      r.addEventListener('click', () => select(p.id));
      pl.append(r);
    }

    // detail
    const box = $('detail');
    const p = projects.find((x) => x.id === selected);
    if (p) {
      box.textContent = '';
      const d = el('div', 'detail');
      const h = el('div'); h.append(el('h3', '', p.name), el('div', 'repo', p.repo || ''));
      d.append(h);
      const st = el('div', 'where'); st.append(pill(p.status), document.createTextNode(` · נמצא ב${ROOMS[ST[p.status].room].he}`)); d.append(st);
      if (!p.sessions.length) d.append(el('div', 'where', p.note || 'אין סוכן פעיל בפרויקט הזה.'));
      for (const a of p.sessions) {
        const s = el('div', 'sess');
        const hd = el('div', 'h'); hd.append(el('span', '', a.name), pill(a.status)); s.append(hd);
        if (a.detail) s.append(el('div', 'd', a.detail));
        if (a.needsAction) s.append(el('div', 'need', `מה צריך ממך: ${a.needsAction}`));
        const f = el('div', 'f');
        f.append(el('span', '', ago(a.updatedAt)));
        if (a.model) f.append(el('span', 'num', a.model));
        if (typeof a.costUsd === 'number') f.append(el('span', 'num', `$${a.costUsd.toFixed(2)}`));
        if (a.url) { const l = el('a', '', 'פתח סשן'); l.href = a.url; l.target = '_blank'; l.rel = 'noopener'; f.append(l); }
        for (const art of a.artifacts || []) { const l = el('a', 'sec', art.title); l.href = art.url; l.target = '_blank'; l.rel = 'noopener'; f.append(l); }
        s.append(f); d.append(s);
      }
      box.append(d);
    }

    // ticker: most recent activity
    const recent = [...agents].sort((x, y) => String(y.updatedAt).localeCompare(String(x.updatedAt))).slice(0, 6)
      .map((a) => `${ago(a.updatedAt)} · ${projects.find((p) => p.id === a.project)?.name ?? a.project}: ${a.name} — ${ST[a.status].he}`);
    $('ticker').textContent = recent.join('   ✦   ') || 'אין פעילות עדיין';
    $('stamp').textContent = meta?.updatedAt ? `שעון ישראל · הנתונים עודכנו ${ago(meta.updatedAt)}` : 'שעון ישראל';

    // legend
    const lg = $('legend');
    if (!lg.children.length) for (const k of ['work', 'entry', 'meet', 'living', 'repair', 'attic']) {
      const st = Object.keys(ST).find((s) => ST[s].room === k);
      const row = el('div'); const sq = el('span', 'sq'); sq.style.background = ST[st].color;
      const txt = el('span'); txt.append(el('strong', '', ROOMS[k].he + ': '), document.createTextNode(ROOMS[k].desc));
      row.append(sq, txt); lg.append(row);
    }
  }

  function tickClock() { const { hh, mm } = israelHour(); $('clock').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; }
  setInterval(tickClock, 15000); tickClock();

  // ------------------------------------------------------------------ boot
  drawHouse(); roomSigns(); renderPanels();
  requestAnimationFrame(frame);
  (async () => {
    const db = await window.claude?.use?.('db');
    if (!db) { $('ticker').textContent = 'אין גישה לנתוני הבית בתצוגה הזו.'; return; }
    const fail = () => { $('ticker').textContent = 'לא הצלחתי לטעון את נתוני הבית — רענן את הדף.'; };
    db.collection('rooms').onSnapshot((s) => { roomsDocs = s.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.rooms = true; rebuild(); }, fail);
    db.collection('agents').onSnapshot((s) => { agents = s.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.agents = true; rebuild(); }, fail);
    db.doc('meta/office').onSnapshot((s) => { meta = s.exists ? s.data() : null; renderPanels(); }, fail);
  })();
})();
</script>
